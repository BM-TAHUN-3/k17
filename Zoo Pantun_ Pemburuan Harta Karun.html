let camMode=0;const CAMS=[["Biasa",0,15,17,1.8],["Atas",0,44,5,0],["Bawah",0,3.2,10,4.5]];$("camBtn").onclick=()=>{camMode=(camMode+1)%3;$("camBtn").textContent="📷 Pandangan: "+CAMS[camMode][0]};
function resolve(p){for(const c of COL){const dx=p.x-c[0],dz=p.z-c[1],d=Math.hypot(dx,dz),m=c[2]+.6;if(d<m&&d>1e-4){p.x=c[0]+dx/d*m;p.z=c[1]+dz/d*m}}for(const b of COLB){const dx=p.x-b[0],dz=p.z-b[1],cs=Math.cos(b[2]),sn=Math.sin(b[2]),lx=dx*cs-dz*sn,lz=dx*sn+dz*cs,hx=b[3]+.6,hz=b[4]+.6;if(Math.abs(lx)<hx&&Math.abs(lz)<hz){let nx=lx,nz=lz;if(hx-Math.abs(lx)<hz-Math.abs(lz))nx=(lx<0?-1:1)*hx;else nz=(lz<0?-1:1)*hz;p.x=b[0]+nx*cs+nz*sn;p.z=b[1]-nx*sn+nz*cs}}}
let last=performance.now(),lp=0,T=0,ini=0;const cp=new THREE.Vector3(),fp=new THREE.Vector3(),tg=new THREE.Vector3();

 if(mine&&!open&&!me.ending){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(Math.hypot(joy.x,joy.z)>.25){dx+=joy.x;dz+=joy.z}if(dx||dz){const n=Math.hypot(dx,dz);mine.position.x=Math.max(-60,Math.min(60,mine.position.x+dx/n*14*dt));mine.position.z=Math.max(-86,Math.min(76,mine.position.z+dz/n*14*dt));resolve(mine.position);if(!me.fin&&mine.position.z<-54.5)mine.position.z=-54.5;if(me.fin&&!me.mic&&Math.hypot(mine.position.x,mine.position.z+66)<2.6){me.mic=1;mine.userData.mic=1;stageMic.visible=false;if(EM)askMic();verse()}if(!me.vid&&mine.position.z<60.5)mine.position.z=60.5;mine.rotation.y=Math.atan2(dx,dz);mv=1}}
